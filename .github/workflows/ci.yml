name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The vendored Apple SDK must stay identical to the pinned upstream tag
      # plus the recorded patches, otherwise it drifts silently.
      - run: npm run vendor:check

  codegen-roundtrip:
    name: Codegen round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace rn-sql-connect-codegen
      # Generates an SDK from the sample connector and compiles it against the
      # library. Catches format drift in firebase-tools output, which would
      # otherwise only surface in a consumer app.
      - run: node scripts/codegen-roundtrip.mjs

  android:
    name: Android build
    runs-on: ubuntu-latest
    # Skipped until the example app is scaffolded. A React Native library has no
    # standalone Gradle project, so it is built through a host app.
    if: hashFiles('example/android/gradlew') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Assemble
        working-directory: example/android
        run: ./gradlew assembleDebug --no-daemon

  ios:
    name: iOS build
    runs-on: macos-15
    # Skipped until the example app is scaffolded.
    if: hashFiles('example/ios/Podfile') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CocoaPods mode, so Data Connect shares one FirebaseCore with
      # react-native-firebase. See docs/ios-spm.md.
      - name: pod install
        working-directory: example/ios
        run: bundle exec pod install
      - name: Build
        working-directory: example/ios
        run: |
          xcodebuild -workspace RnSqlConnectExample.xcworkspace \
            -scheme RnSqlConnectExample \
            -sdk iphonesimulator \
            -configuration Debug build | xcpretty

  ios-rejects-spm-mode:
    name: Podspec rejects react-native-firebase in SPM mode
    runs-on: macos-15
    if: hashFiles('example/ios/Podfile') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A negative test. With react-native-firebase in SPM mode there would be
      # two copies of FirebaseCore and every call would fail at runtime with
      # not-configured, so `pod install` has to refuse instead.
      - name: pod install must fail
        working-directory: example/ios
        run: |
          sed -i '' 's/^\$RNFirebaseDisableSPM = true/$RNFirebaseDisableSPM = false/' Podfile
          if bundle exec pod install; then
            echo "Expected pod install to fail when react-native-firebase uses SPM"
            exit 1
          fi

  upstream-watch:
    name: Watch upstream SDK releases
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Compare pinned versions with upstream
        run: node scripts/check-upstream-versions.mjs
