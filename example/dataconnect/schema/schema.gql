# Sample schema used by the example app and by the emulator based tests.
# It is intentionally tiny, but it covers every scalar the SDK has to carry
# across the bridge, because type fidelity is the thing most likely to break
# quietly.

type Movie @table(key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  title: String!
  releaseYear: Int
  genre: String
  rating: Int

  # Scalars that are carried as strings on the wire. Getting these wrong is
  # invisible until a number is off by one or a date shifts by a timezone.
  viewCount: Int64
  releasedAt: Timestamp
  releasedOn: Date

  # Scalars that are carried as JSON primitives.
  score: Float
  isFeatured: Boolean

  # Lists. Data Connect maps a GraphQL list to a one-dimensional SQL array.
  tags: [String]
  scores: [Int]

  metadata: Any
  createdAt: Timestamp! @default(expr: "request.time")
}

type Review @table(key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  movie: Movie!
  authorUid: String!
  body: String!
  createdAt: Timestamp! @default(expr: "request.time")
}
