# Operations used by the example app and the emulator tests.

query GetMovieById($id: UUID!) @auth(level: PUBLIC, insecureReason: "sample app") {
  movie(id: $id) {
    id
    title
    releaseYear
    genre
    rating
    viewCount
    releasedAt
    releasedOn
    score
    isFeatured
    tags
    scores
    metadata
  }
}

# A single entity lookup by primary key gets refresh signals implicitly, so this
# one needs no @refresh directive to work with subscribe().

query ListMoviesByGenre($genre: String, $limit: Int)
@auth(level: PUBLIC, insecureReason: "sample app")
@refresh(onMutationExecuted: { operation: "UpdateMovie", condition: "request.variables.genre == mutation.variables.genre" })
@refresh(onMutationExecuted: { operation: "CreateMovie", condition: "request.variables.genre == mutation.variables.genre" }) {
  movies(where: { genre: { eq: $genre } }, limit: $limit) {
    id
    title
    genre
    rating
  }
}

# Requires a signed-in user. Proves that Data Connect reads the identity from
# the same FirebaseApp that react-native-firebase configured, which is the whole
# reason this package exists.
query GetMyReviews @auth(level: USER) {
  reviews(where: { authorUid: { eq_expr: "auth.uid" } }) {
    id
    body
    createdAt
  }
}

mutation CreateMovie(
  $title: String!
  $releaseYear: Int
  $genre: String
  $rating: Int
  $viewCount: Int64
  $releasedAt: Timestamp
  $releasedOn: Date
  $score: Float
  $isFeatured: Boolean
  $tags: [String!]
  $scores: [Int!]
  $metadata: Any
) @auth(level: PUBLIC, insecureReason: "sample app") {
  movie_insert(
    data: {
      title: $title
      releaseYear: $releaseYear
      genre: $genre
      rating: $rating
      viewCount: $viewCount
      releasedAt: $releasedAt
      releasedOn: $releasedOn
      score: $score
      isFeatured: $isFeatured
      tags: $tags
      scores: $scores
      metadata: $metadata
    }
  )
}

mutation UpdateMovie($id: UUID!, $genre: String, $rating: Int)
@auth(level: PUBLIC, insecureReason: "sample app") {
  movie_update(id: $id, data: { genre: $genre, rating: $rating })
}

mutation DeleteMovie($id: UUID!) @auth(level: PUBLIC, insecureReason: "sample app") {
  movie_delete(id: $id)
}

# Writes as the signed-in user. Pairs with GetMyReviews.
mutation CreateMyReview($movieId: UUID!, $body: String!) @auth(level: USER) {
  review_insert(data: { movieId: $movieId, body: $body, authorUid_expr: "auth.uid" })
}
